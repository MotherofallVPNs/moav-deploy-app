name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # Live-tagged tests skip themselves here: no MOAV_TEST_* in this job.
      # The live round is a separate, secrets-gated workflow (live.yml).
      # Gate on the plain run; coverage collection can flake on the runner.
      - run: flutter test
      - name: Coverage (non-blocking)
        run: flutter test --coverage || true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Debug APK smoke build so Gradle or plugin drift shows up on the PR
  # rather than at release time. Unsigned, nothing is uploaded.
  apk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
