name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      # Secrets are absent on forks and unprivileged runs; skip signing there
      # instead of failing so the workflow stays green for contributors.
      - name: Restore release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed AAB and APK
        if: env.HAS_SIGNING == 'true'
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # Checksums let sideloaders verify a mirrored APK:
      #   sha256sum -c SHA256SUMS
      # The file lists bare filenames so it works in any download directory.
      - name: Write SHA256SUMS
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          {
            (cd build/app/outputs/bundle/release && sha256sum app-release.aab)
            (cd build/app/outputs/flutter-apk && sha256sum app-release.apk)
          } > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Skip signed build
        if: env.HAS_SIGNING != 'true'
        run: echo "ANDROID_KEYSTORE_BASE64 not set; skipping signed build."

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - name: Upload workflow artifacts
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moav-deploy-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/SHA256SUMS
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: env.HAS_SIGNING == 'true' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/SHA256SUMS

      # Release notes come from fastlane/metadata (single source of truth for
      # Play, the GitHub release and the PR body). Idempotent on re-runs.
      - name: Append store release notes to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --json body -q .body)"
          if grep -q '^## Store release notes' <<<"$body"; then
            echo "Release body already has store release notes; leaving as is."
            exit 0
          fi
          notes="$(scripts/release-notes.sh)"
          printf '%s\n\n%s\n' "$body" "$notes" > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

      # Play delivery: only on a published release, only when the service
      # account secret exists. Manual builds and forks skip with a log line.
      - name: Skip Play upload
        if: github.event_name != 'release' || env.HAS_SIGNING != 'true' || env.HAS_PLAY_KEY != 'true'
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Not a published release; skipping Play closed testing upload."
          elif [ "$HAS_SIGNING" != "true" ]; then
            echo "No signed AAB (ANDROID_KEYSTORE_BASE64 unset); skipping Play closed testing upload."
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON not set; skipping Play closed testing upload."
          fi

      - name: Set up Ruby
        if: github.event_name == 'release' && env.HAS_SIGNING == 'true' && env.HAS_PLAY_KEY == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Write Play service-account key
        if: github.event_name == 'release' && env.HAS_SIGNING == 'true' && env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/play-service-account.json"
          umask 077
          # Accept the secret either as raw JSON or base64-encoded JSON.
          if [[ "$PLAY_SERVICE_ACCOUNT_JSON" == \{* ]]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_path"
          else
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > "$key_path"
          fi
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$key_path"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload to Play closed testing track
        if: github.event_name == 'release' && env.HAS_SIGNING == 'true' && env.HAS_PLAY_KEY == 'true'
        working-directory: android
        run: bundle exec fastlane android closed_testing

      - name: Remove Play service-account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"

  # iOS delivery: a separate macOS job so an Apple-side failure never blocks
  # the Android artifacts above. Only on a published release and only when the
  # App Store Connect + match secrets exist. The presence check runs on a cheap
  # Linux runner so forks and secret-less runs never spin up a macOS runner.
  ios-preflight:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          HAS_IOS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.MATCH_PASSWORD != '' && secrets.MATCH_DEPLOY_KEY != '' }}
        run: |
          echo "has_secrets=$HAS_IOS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_IOS_SECRETS" != "true" ]; then
            echo "iOS secrets (ASC_* / MATCH_*) not set; skipping the TestFlight upload."
          fi

  ios:
    needs: ios-preflight
    if: needs.ios-preflight.outputs.has_secrets == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: flutter --version
      - run: flutter pub get

      # The .p8 and the match deploy key only ever exist under $RUNNER_TEMP
      # with mode 0600; the cleanup step below removes them even on failure.
      # github.com host keys come from the API over HTTPS, not ssh-keyscan.
      - name: Write App Store Connect key and match deploy key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match_deploy_key"
          grep -q 'BEGIN OPENSSH PRIVATE KEY' "$RUNNER_TEMP/match_deploy_key"
          mkdir -p ~/.ssh
          # ssh-keyscan avoids the unauthenticated api.github.com rate limit (403).
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "MATCH_GIT_PRIVATE_KEY=$RUNNER_TEMP/match_deploy_key"
            echo "IOS_KEYCHAIN_PASSWORD=$keychain_password"
          } >> "$GITHUB_ENV"

      # Fail early with a pointed message if the deploy key is not registered
      # on the match repo, instead of a generic clone error deep inside match.
      - name: Check read access to the match repo
        run: |
          set -euo pipefail
          if ! GIT_SSH_COMMAND="ssh -i $MATCH_GIT_PRIVATE_KEY -o IdentitiesOnly=yes" \
              git ls-remote --exit-code git@github.com:MotherofallVPNs/moav-deploy-match.git HEAD >/dev/null; then
            echo "::error::Cannot read MotherofallVPNs/moav-deploy-match with MATCH_DEPLOY_KEY. Add its public key as a read-only deploy key on that repo (see docs/RELEASING.md)."
            exit 1
          fi

      - name: Build and upload to TestFlight (internal)
        working-directory: android
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: bundle exec fastlane ios beta

      - name: Upload IPA as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moav-deploy-ios-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/match_deploy_key"
          security delete-keychain "$HOME/Library/Keychains/moav-deploy-ios.keychain-db" 2>/dev/null || true
