  - VPN & Proxy
License: MIT
AuthorName: MotherofallVPNs
WebSite: https://moav.sh
SourceCode: https://github.com/MotherofallVPNs/moav-deploy-app
IssueTracker: https://github.com/MotherofallVPNs/moav-deploy-app/issues
Changelog: https://github.com/MotherofallVPNs/moav-deploy-app/releases
Donate: https://buy.stripe.com/6oU9AT96x8t21xX3Wc5c400

AutoName: MoaV Deploy

RepoType: git
Repo: https://github.com/MotherofallVPNs/moav-deploy-app.git

Builds:
  - versionName: 0.2.16
    versionCode: 19
    commit: 533e6ba7146f0c9e6836ef8915a968e75fcc53a8
    sudo:
      - mkdir -p /home/runner/work/moav-deploy-app
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - integration_test
      - test_driver
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:[[:space:]]*"?([0-9.]+)"?.*/\1/p'
        .github/workflows/release.yml | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfig = if (keystorePropertiesFile.exists())/,+3d' android/app/build.gradle.kts
      - '! grep -q "signingConfig = " android/app/build.gradle.kts'
      - export repo=/home/runner/work/moav-deploy-app/moav-deploy-app
      - cd ..
      - mv org.motherofallvpns.moavdeploy $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo org.motherofallvpns.moavdeploy
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/moav-deploy-app/moav-deploy-app
      - cd ..
      - mv org.motherofallvpns.moavdeploy $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo org.motherofallvpns.moavdeploy

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.16
CurrentVersionCode: 19
