name: moav_deploy
description: Deploy, manage, and monitor MoaV servers from your phone.
publish_to: "none"
version: 0.2.1+4

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.1.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.10
  local_auth_darwin: ^2.0.4
  pinenacl: ^0.6.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon-1024.png
  android: true
  adaptive_icon_background: assets/icon/icon-background.png
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Font license texts travel with the binary (SIL OFL requires it) and are
  # registered with LicenseRegistry in lib/main.dart.
  assets:
    - assets/fonts/LICENSE-Inter.txt
    - assets/fonts/LICENSE-JetBrainsMono.txt

  # Fonts are bundled offline (no runtime font fetching: at-risk users must
  # never trigger a network request just to render text).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
