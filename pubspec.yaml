name: moav_deploy
description: Deploy, manage, and monitor MoaV servers from your phone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dartssh2: ^4.1.0
  flutter_secure_storage: ^11.1.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  local_auth: ^3.0.2
  pinenacl: ^0.6.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
